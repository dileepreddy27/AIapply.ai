<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; width: 360px; margin: 0; padding: 12px; background: #0f1115; color: #e8eaed; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      label { display: block; font-size: 11px; opacity: 0.7; margin: 8px 0 2px; }
      input, select, textarea { width: 100%; box-sizing: border-box; padding: 6px; border-radius: 6px; border: 1px solid #2a2f3a; background: #171a21; color: #e8eaed; font-size: 12px; }
      button { margin-top: 8px; padding: 7px 10px; border: 0; border-radius: 6px; background: #4f7cff; color: #fff; font-size: 12px; cursor: pointer; }
      button.secondary { background: #2a2f3a; }
      .row { display: flex; gap: 6px; }
      .row button { flex: 1; }
      .muted { font-size: 11px; opacity: 0.7; }
      #out { margin-top: 10px; max-height: 260px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
      .card { border: 1px solid #2a2f3a; border-radius: 8px; padding: 8px; margin-bottom: 6px; }
      details summary { cursor: pointer; font-size: 12px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>AIapply.ai</h1>
    <div id="detected" class="muted">Detecting job on this page…</div>

    <div class="row">
      <button id="match">Find Matches</button>
      <button id="tailorResume" class="secondary">Tailor Resume</button>
      <button id="tailorCover" class="secondary">Cover Letter</button>
    </div>

    <div id="out"></div>

    <details>
      <summary>Settings</summary>
      <label>Backend URL</label>
      <input id="backendUrl" placeholder="https://aiapply-backend.onrender.com" />
      <label>Access token (Supabase JWT from the web app)</label>
      <input id="token" type="password" placeholder="eyJhbGci..." />
      <button id="save" class="secondary">Save settings</button>
      <p class="muted">Get your token from the web app: open DevTools console on the dashboard and run
        <code>copy((await supabase.auth.getSession()).data.session.access_token)</code>.</p>
    </details>

    <script src="popup.js"></script>
  </body>
</html>
